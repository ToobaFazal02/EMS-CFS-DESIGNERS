[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# rlib alone is enough for the Windows bin to link app_lib::run.
# Building staticlib+cdylib+rlib together was producing a ~4GB corrupt
# rlib on low-RAM machines (OOM mid-write → LNK4003 invalid library).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Low-RAM release: avoid LTO / fat opt which OOMs this PC during link.
[profile.release]
lto = false
codegen-units = 16
opt-level = 2
strip = true
debug = false
incremental = false
panic = "abort"
