# Build Manager Setup.exe on GitHub (avoids local 16GB OOM).
# Run: GitHub → Actions → "Build Manager Setup" → Run workflow
name: Build Manager Setup

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Low-RAM cargo settings
        shell: bash
        run: |
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Install frontend deps
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: CFS-Designers-Manager-Setup
          path: apps/web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
